<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FDFCF0" />
    <title>Worship Together</title>
    <style>
      :root {
        color: #1f2a2a;
        background: #f7f5ef;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100dvh;
        margin: 0;
        place-items: center;
        padding: 32px;
      }

      main {
        width: min(100%, 420px);
        border: 1px solid rgba(21, 62, 59, 0.12);
        border-radius: 24px;
        background: rgba(255, 253, 248, 0.72);
        box-shadow: 0 24px 80px rgba(21, 62, 59, 0.1);
        padding: 28px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0;
      }

      p {
        margin: 16px 0 0;
        color: rgba(31, 42, 42, 0.64);
        line-height: 1.6;
      }

      code {
        border-radius: 8px;
        background: rgba(21, 62, 59, 0.08);
        color: #153e3b;
        padding: 2px 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Worship Together</h1>
      <p>
        Set <code>CAPACITOR_SERVER_URL</code> to your deployed Next.js URL, then
        run <code>npm run mobile:sync</code> to load the live app in this native
        shell.
      </p>
    </main>
  </body>
</html>
