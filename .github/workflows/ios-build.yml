# iOS 앱 셸(Capacitor 8 · SPM)을 서명 없이 시뮬레이터용으로 빌드하고, 로컬 Next.js 서버를 불러오도록 실행해 봅니다.
# 서명 · TestFlight 배포는 아직 하지 않습니다. 자세한 내용: docs/ios-app.md
name: iOS build

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "mobile-www/**"
      - "components/app/NativeBridge.tsx"
      - "lib/nativeNav.ts"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "mobile-www/**"
      - "components/app/NativeBridge.tsx"
      - "lib/nativeNav.ts"
      - ".github/workflows/ios-build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  simulator:
    name: Build and launch on iOS Simulator
    runs-on: macos-15
    timeout-minutes: 40
    env:
      APP_BUNDLE_ID: com.worshiptogether.app
      SERVER_URL: http://localhost:4000
      NEXTAUTH_URL: http://localhost:4000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check Xcode version (Capacitor 8 needs Xcode 26+)
        run: |
          xcodebuild -version
          major="$(xcodebuild -version | awk 'NR == 1 { split($2, v, "."); print v[1] }')"
          if [ "${major:-0}" -lt 26 ]; then
            echo "::error::Capacitor 8 needs Xcode 26 or later, but $(xcodebuild -version | head -n 1) is selected."
            exit 1
          fi
          xcrun simctl list runtimes available

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          # 이 실행에서만 쓰는 NextAuth 비밀값입니다. 로그에는 가려집니다.
          secret="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::$secret"
          {
            echo "NEXTAUTH_SECRET=$secret"
            echo "TEAM_DATABASE_PATH=$RUNNER_TEMP/teams.sqlite"
            echo "ARTIFACTS_DIR=$RUNNER_TEMP/ios-artifacts"
            echo "DERIVED_DATA=$RUNNER_TEMP/dd"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ios-artifacts"

      - name: Build web app
        run: npm run build

      - name: Start web server
        run: |
          nohup npm run start -- -p 4000 > "$RUNNER_TEMP/server.log" 2>&1 &
          status=""
          for attempt in $(seq 1 60); do
            status="$(curl -s -o /dev/null -w '%{http_code}' "$SERVER_URL/login" || true)"
            if [ "$status" = "200" ]; then
              echo "Server ready after $attempt attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::$SERVER_URL/login did not return 200 (last status: ${status:-none})."
          exit 1

      - name: Sync Capacitor iOS project
        env:
          CAPACITOR_SERVER_URL: ${{ env.SERVER_URL }}
        run: |
          npx cap sync ios
          jq -e --arg url "$SERVER_URL" '.server.url == $url' ios/App/App/capacitor.config.json
          # 커밋된 ios/ (특히 CapApp-SPM/Package.swift)가 지금 설치된 Capacitor · 플러그인과 맞는지 확인합니다.
          if [ -n "$(git status --porcelain -- ios)" ]; then
            git status --short -- ios
            git diff -- ios
            echo "::error::npx cap sync ios changed tracked files under ios/. Run it locally and commit the result."
            exit 1
          fi

      - name: Resolve Swift packages
        timeout-minutes: 10
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -derivedDataPath "$DERIVED_DATA"

      - name: Build for iOS Simulator (unsigned)
        timeout-minutes: 20
        run: |
          status=0
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || status=$?
          tail -n 400 "$RUNNER_TEMP/xcodebuild.log" > "$ARTIFACTS_DIR/xcodebuild-tail.log"
          if [ "$status" -ne 0 ]; then
            grep -E ' error: |\*\* BUILD FAILED' "$RUNNER_TEMP/xcodebuild.log" | head -n 50 || true
            tail -n 150 "$RUNNER_TEMP/xcodebuild.log"
            echo "::error::xcodebuild failed with status $status."
            exit "$status"
          fi
          tail -n 5 "$RUNNER_TEMP/xcodebuild.log"

      - name: Inspect built app
        run: |
          app="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$app"
          echo "APP_PATH=$app" >> "$GITHUB_ENV"
          plist="$app/Info.plist"
          plutil -p "$plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "$APP_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist")" = "Worship Together"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsLocalNetworking' "$plist")" = "true"
          if /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsArbitraryLoads' "$plist" 2>/dev/null; then
            echo "::error::NSAllowsArbitraryLoads must not be set; only NSAllowsLocalNetworking is allowed."
            exit 1
          fi
          jq -e --arg url "$SERVER_URL" '.server.url == $url' "$app/capacitor.config.json"
          jq -e 'any(.packageClassList[]; . == "AppPlugin")' "$app/capacitor.config.json"
          ls "$app/Frameworks" 2>/dev/null || true
          # 서명하지 않은 빌드라 entitlements 는 앱에 적용되지 않습니다. Xcode 가 처리했다면 값만 보여 줍니다.
          find "$DERIVED_DATA/Build/Intermediates.noindex" -name '*.xcent' -print -exec plutil -p {} \; 2>/dev/null || true

      - name: Boot simulator
        timeout-minutes: 10
        run: |
          device="$(xcrun simctl list devices available -j | node -e '
            const { devices } = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            const version = (key) => (key.match(/SimRuntime\.iOS-(\d+)-(\d+)/) || []).slice(1).map(Number);
            const runtimes = Object.keys(devices)
              .filter((key) => version(key).length === 2)
              .sort((a, b) => version(b)[0] - version(a)[0] || version(b)[1] - version(a)[1]);
            for (const runtime of runtimes) {
              const phone = devices[runtime].find((d) => d.isAvailable && d.name.startsWith("iPhone"));
              if (phone) {
                console.log([phone.udid, phone.name, runtime].join("\t"));
                process.exit(0);
              }
            }
            console.error("No available iPhone simulator.");
            process.exit(1);
          ')"
          IFS=$'\t' read -r udid name runtime <<< "$device"
          echo "Using $name ($runtime) $udid"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          echo "Simulator: $name ($runtime)" >> "$GITHUB_STEP_SUMMARY"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b

      - name: Install, launch and take screenshots
        timeout-minutes: 12
        run: |
          # 첫 부팅 직후(데이터 마이그레이션이 막 끝난 때) simctl install 이 응답 없이 멈추는 일이 있어
          # (실행 #3: 5분 넘게 멈춤), 명령마다 감시 시간을 두고 다시 시도합니다. 어디서 멈췄는지 로그에 남깁니다.
          with_watchdog() {
            local seconds=$1; shift
            "$@" &
            local pid=$!
            ( sleep "$seconds"; kill -TERM "$pid" 2>/dev/null ) &
            local watcher=$!
            local rc=0
            wait "$pid" || rc=$?
            kill "$watcher" 2>/dev/null || true
            wait "$watcher" 2>/dev/null || true
            return "$rc"
          }
          retry() {
            local attempts=$1 seconds=$2; shift 2
            local n
            for n in $(seq 1 "$attempts"); do
              echo "[$(date -u +%T)] $* (attempt $n/$attempts, limit ${seconds}s)"
              if with_watchdog "$seconds" "$@"; then return 0; fi
              echo "::warning::'$1 $2 $3' failed or timed out (attempt $n)"
              sleep 10
            done
            return 1
          }
          xcrun simctl spawn "$SIM_UDID" log stream --style compact --level info \
            --predicate 'process == "App" OR process BEGINSWITH "com.apple.WebKit"' \
            > "$ARTIFACTS_DIR/simulator.log" 2>&1 &
          log_pid=$!
          # 홈 화면(SpringBoard)까지 올라온 뒤 설치합니다.
          retry 3 60 xcrun simctl bootstatus "$SIM_UDID" -b
          retry 3 150 xcrun simctl install "$SIM_UDID" "$APP_PATH"
          retry 2 90 xcrun simctl launch "$SIM_UDID" "$APP_BUNDLE_ID"
          echo "[$(date -u +%T)] launched; waiting for the first screen"
          sleep 20
          xcrun simctl io "$SIM_UDID" screenshot "$ARTIFACTS_DIR/ios-start-20s.png"
          sleep 10
          xcrun simctl io "$SIM_UDID" screenshot "$ARTIFACTS_DIR/ios-start-30s.png"
          kill "$log_pid" 2>/dev/null || true
          if ! xcrun simctl spawn "$SIM_UDID" launchctl list | grep -F "$APP_BUNDLE_ID"; then
            echo "::error::$APP_BUNDLE_ID is not running 30 s after launch (crashed or failed to start)."
            exit 1
          fi
          if grep -F "App Transport Security" "$ARTIFACTS_DIR/simulator.log"; then
            echo "::warning::The simulator log mentions App Transport Security; check that $SERVER_URL loaded (screenshots)."
          fi
          echo "App is running; screenshots are in the ios-simulator artifact." >> "$GITHUB_STEP_SUMMARY"

      - name: Show server log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/server.log" || true

      - name: Collect server log
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/server.log" ] && [ -d "${ARTIFACTS_DIR:-}" ]; then
            tail -n 300 "$RUNNER_TEMP/server.log" > "$ARTIFACTS_DIR/server-tail.log"
          fi

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-artifacts/
          retention-days: 7
          if-no-files-found: warn
