<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#153E3B" />
    <title>네트워크 연결 확인 - Worship Together</title>
    <style>
      :root {
        --bg: #f7f5ef;
        --card-bg: rgba(255, 253, 248, 0.92);
        --card-border: rgba(21, 62, 59, 0.12);
        --text: #1f2a2a;
        --text-muted: rgba(31, 42, 42, 0.72);
        --primary: #153e3b;
        --primary-fg: #fffdf8;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1514;
          --card-bg: rgba(22, 33, 31, 0.94);
          --card-border: rgba(255, 255, 255, 0.12);
          --text: #f3f7f6;
          --text-muted: rgba(243, 247, 246, 0.65);
          --primary: #2d7a74;
          --primary-fg: #ffffff;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100dvh;
        margin: 0;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
        padding: max(24px, env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(20px, env(safe-area-inset-left));
      }

      main {
        width: min(100%, 440px);
        border: 1px solid var(--card-border);
        border-radius: 24px;
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.15);
        padding: 28px;
        text-align: center;
      }

      .mark {
        display: inline-grid;
        width: 60px;
        height: 60px;
        margin-bottom: 20px;
        place-items: center;
        border-radius: 18px;
        background: var(--primary);
        color: var(--primary-fg);
        font-size: 26px;
        font-weight: 900;
      }

      h1 {
        margin: 0;
        color: var(--text);
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      p {
        margin: 12px 0 0;
        color: var(--text-muted);
        line-height: 1.6;
        font-size: 14px;
      }

      .actions {
        margin-top: 24px;
        display: flex;
        gap: 10px;
        justify-content: center;
      }

      button, a {
        min-height: 44px;
        border: 0;
        border-radius: 14px;
        background: var(--primary);
        color: var(--primary-fg);
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        padding: 12px 20px;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.15s ease;
      }

      button:active, a:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">W</div>
      <h1>인터넷 연결이 끊어졌습니다</h1>
      <p>
        Worship Together는 실시간 세션 동기화, 콘티 조회, 예배 알림을 위해 네트워크가 필요합니다. 연결 확인 후 다시 시도해주세요.
      </p>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">다시 연결하기</button>
      </div>
    </main>
  </body>
</html>
