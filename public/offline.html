<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FFFFFF" />
    <title>네트워크 연결 확인 - Worship Together</title>
    <style>
      :root {
        --bg: #ffffff;
        --card-bg: #ffffff;
        --card-border: #ebebeb;
        --text: #171717;
        --text-muted: #737373;
        --primary: #171717;
        --primary-fg: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --card-bg: #181818;
          --card-border: #2a2a2a;
          --text: #fafafa;
          --text-muted: #a3a3a3;
          --primary: #fafafa;
          --primary-fg: #171717;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100dvh;
        margin: 0;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
        padding: max(24px, env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(20px, env(safe-area-inset-left));
      }

      main {
        width: min(100%, 440px);
        border: 1px solid var(--card-border);
        border-radius: 24px;
        background: var(--card-bg);
        padding: 28px;
        text-align: center;
      }

      .mark {
        display: inline-block;
        width: 60px;
        height: 60px;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        color: var(--text);
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      p {
        margin: 12px 0 0;
        color: var(--text-muted);
        line-height: 1.6;
        font-size: 14px;
      }

      .actions {
        margin-top: 24px;
        display: flex;
        gap: 10px;
        justify-content: center;
      }

      button, a {
        min-height: 44px;
        border: 0;
        border-radius: 9999px;
        background: var(--primary);
        color: var(--primary-fg);
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 12px 22px;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.15s ease;
      }

      button:active, a:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14.5" fill="#153E3B"/><g transform="translate(32 32) scale(0.64) translate(-32 -32)" fill="none" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17 L21 46 L32 17" stroke="#9EC7B5"/><path d="M32 17 L43 46 L54 17" stroke="#FFFFFF"/></g></svg>
      <h1>인터넷 연결이 끊어졌습니다</h1>
      <p>
        Worship Together는 실시간 세션 동기화, 콘티 조회, 예배 알림을 위해 네트워크가 필요합니다. 연결 확인 후 다시 시도해주세요.
      </p>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">다시 연결하기</button>
      </div>
    </main>
  </body>
</html>
